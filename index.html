<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    /* 极简重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #app {
      height: 100%;
      width: 100%;
    }

    /* 加载容器：白底，干净若依风格 */
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;  /* 纯白背景，符合若依浅色主题 */
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    /* 轻量科技容器，无多余装饰 */
    .tech-loader {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* 极简旋转环：浅蓝主色调 */
    .light-ring {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(64, 158, 255, 0.2);   /* 若依蓝 #409EFF 半透明 */
      border-top-color: #409EFF;
      border-right-color: rgba(64, 158, 255, 0.6);
      animation: smoothSpin 0.85s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 2px rgba(64, 158, 255, 0.2);
    }

    /* 柔和核心脉冲点 */
    .pulse-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #409EFF;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px #409EFF;
      animation: gentlePulse 1.2s infinite alternate;
    }

    /* 文字样式：若依常用深灰色+浅蓝点缀 */
    .loader-text {
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      color: #606266;   /* 若依主文本色 */
    }

    /* 底部微标，科技感小提示 */
    .status-badge {
      font-size: 0.7rem;
      font-family: monospace;
      color: #909399;
      background: #f5f7fa;
      padding: 4px 12px;
      border-radius: 30px;
      border: 0.5px solid #e4e7ed;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge span {
      color: #409EFF;
      font-weight: 600;
    }

    /* 简单动画 - 性能友好 */
    @keyframes smoothSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes gentlePulse {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.8); box-shadow: 0 0 2px #409EFF; }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 6px #409EFF; }
    }

    /* 加载完成过渡 - 兼容原有loaded机制 */
    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s linear, visibility 0.2s linear;
      pointer-events: none;
    }

    /* 无JS备用 */
    .no-js #loader-wrapper {
      display: none;
    }

    /* 性能优化 */
    @media (prefers-reduced-motion: reduce) {
      .spinner-core {
        animation: none;
      }
      .pulse-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="tech-loader">
        <div class="light-ring">
          <div class="spinner-core"></div>
          <div class="pulse-dot"></div>
        </div>
        <div class="loader-text">初始化中...</div>
        <div class="status-badge">
          <span>◉</span> 数据正在加载，请稍候...
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
